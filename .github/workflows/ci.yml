name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Offline studio and research verification
        run: make verify
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Browser module syntax
        run: |
          node --check presenter/web/studio.js
          node --check presenter/web/stage.js
          node --check presenter/web/visuals.js
          node --check presenter/web/recording.js
          node --check presenter/web/microphone.js
          node --check presenter/web/pcm-worklet.js
          node --test test_microphone.mjs
  native:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-native.txt
      - name: Native rendering and attention without a display
        run: python -m unittest test_native_output
